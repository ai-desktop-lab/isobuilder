name: Custom OS Images

on:
  pull_request:
    paths:
      - '.github/workflows/custom-iso.yml'
      - 'debian-ai-desktop-iso/**'
      - 'rpm-custom-iso/**'
      - 'container/**'
      - 'cloud/**'
      - 'debian-custom-iso/Makefile'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/custom-iso.yml'
      - 'debian-ai-desktop-iso/**'
      - 'rpm-custom-iso/**'
      - 'container/**'
      - 'cloud/**'
      - 'debian-custom-iso/Makefile'
  workflow_dispatch:
    inputs:
      target:
        description: OS profile to build
        type: choice
        required: true
        default: all
        options: [all, debian, ubuntu, fedora, rocky]
      build_iso:
        description: Run the network-heavy ISO builders
        type: boolean
        required: true
        default: false
      build_container:
        description: Build OCI container image archives
        type: boolean
        required: true
        default: false
      build_cloud:
        description: Build qcow2 cloud VM images
        type: boolean
        required: true
        default: false
      display_manager:
        description: Debian/Ubuntu ISO display manager
        type: choice
        default: lightdm
        options: [lightdm, sddm]
      desktop_core:
        description: Debian/Ubuntu ISO desktop core
        type: choice
        default: icewm
        options: [icewm, kde]
      debian_deb_url:
        description: URL of a Debian trixie .deb archive (required for Debian/all)
        type: string
        required: false
        default: ''
      ubuntu_deb_url:
        description: URL of an Ubuntu resolute .deb archive (required for Ubuntu/all)
        type: string
        required: false
        default: ''
      publish_object_storage:
        description: Publish successful build artifacts to S3-compatible object storage
        type: boolean
        required: true
        default: false
      object_storage_prefix:
        description: Object key prefix below the configured bucket
        type: string
        required: true
        default: isobuilder

permissions:
  contents: read
  id-token: write

concurrency:
  group: custom-iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate image profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n debian-ai-desktop-iso/build.sh
          bash -n rpm-custom-iso/build.sh
          bash -n container/build.sh
          bash -n container/start-container.sh
          bash -n cloud/build.sh
          test -f rpm-custom-iso/project/fedora-core.list
          test -f rpm-custom-iso/project/rocky-core.list
          test -f cloud/cloud-init/99-task-ai-desktop.cfg
          test -f container/Containerfile
      - name: Validate workflow contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'target:' .github/workflows/custom-iso.yml
          grep -q 'resolute' .github/workflows/custom-iso.yml
          grep -q 'fedora' .github/workflows/custom-iso.yml
          grep -q 'fedora:43' .github/workflows/custom-iso.yml
          grep -q 'rocky' .github/workflows/custom-iso.yml
          grep -q 'rockylinux:10' .github/workflows/custom-iso.yml
          grep -q 'build_container' .github/workflows/custom-iso.yml
          grep -q 'build_cloud' .github/workflows/custom-iso.yml

  build-container:
    name: Build ${{ matrix.target }} container
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_container }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian
            family: debian
            release: '13'
            image: debian:13
          - target: ubuntu
            family: ubuntu
            release: '26.04'
            image: ubuntu:26.04
          - target: fedora
            family: fedora
            release: '43'
            image: fedora:43
          - target: rocky-9
            family: rocky
            release: '9'
            image: rockylinux:9
          - target: rocky-10
            family: rocky
            release: '10'
            image: rockylinux:10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optional Debian desktop packages
        if: ${{ (inputs.target == 'all' || inputs.target == matrix.family || (inputs.target == 'rocky' && matrix.family == 'rocky')) && ((matrix.family == 'debian' && inputs.debian_deb_url != '') || (matrix.family == 'ubuntu' && inputs.ubuntu_deb_url != '')) }}
        env:
          TARGET: ${{ matrix.family }}
          DEBIAN_DEB_URL: ${{ inputs.debian_deb_url }}
          UBUNTU_DEB_URL: ${{ inputs.ubuntu_deb_url }}
        run: |
          set -euo pipefail
          case "${TARGET}" in
            debian) package_url="${DEBIAN_DEB_URL}" ;;
            ubuntu) package_url="${UBUNTU_DEB_URL}" ;;
            *) echo "unsupported package target: ${TARGET}" >&2; exit 2 ;;
          esac
          mkdir -p "$RUNNER_TEMP/ai-desktop-debs"
          curl --fail --location --retry 3 "${package_url}" -o "$RUNNER_TEMP/ai-desktop-debs/packages.tar.gz"
          tar -xzf "$RUNNER_TEMP/ai-desktop-debs/packages.tar.gz" -C "$RUNNER_TEMP/ai-desktop-debs"
          echo "AI_DESKTOP_DEB_DIR=$RUNNER_TEMP/ai-desktop-debs" >> "$GITHUB_ENV"
      - name: Install OCI export tool
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Build and export OCI archive
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family || (inputs.target == 'rocky' && matrix.family == 'rocky') }}
        env:
          OS_FAMILY: ${{ matrix.family }}
          OS_RELEASE: ${{ matrix.release }}
          BASE_IMAGE: ${{ matrix.image }}
          OUTPUT_DIR: ${{ github.workspace }}/container/output
          IMAGE_TAG: task-ai-desktop:${{ matrix.target }}
          CONTAINER_RUNTIME: docker
        run: ./container/build.sh
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family || (inputs.target == 'rocky' && matrix.family == 'rocky') }}
        with:
          name: task-ai-desktop-container-${{ matrix.target }}
          path: container/output/*.oci.tar
          if-no-files-found: error

  build-cloud:
    name: Build ${{ matrix.target }} cloud image
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_cloud }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian
            family: debian
            release: '13'
            template: debian-13
          - target: ubuntu
            family: ubuntu
            release: '26.04'
            template: ubuntu-26.04
          - target: fedora
            family: fedora
            release: '43'
            template: fedora-43
          - target: rocky-9
            family: rocky
            release: '9'
            template: rocky-9
          - target: rocky-10
            family: rocky
            release: '10'
            template: rocky-10
    steps:
      - uses: actions/checkout@v4
      - name: Install cloud image tools
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family || (inputs.target == 'rocky' && matrix.family == 'rocky') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-utils
      - name: Build qcow2 cloud image
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family || (inputs.target == 'rocky' && matrix.family == 'rocky') }}
        env:
          OS_FAMILY: ${{ matrix.family }}
          OS_RELEASE: ${{ matrix.release }}
          CLOUD_TEMPLATE: ${{ matrix.template }}
          OUTPUT_DIR: ${{ github.workspace }}/cloud/output
          LIBGUESTFS_BACKEND: direct
        run: sudo --preserve-env=OS_FAMILY,OS_RELEASE,CLOUD_TEMPLATE,OUTPUT_DIR,LIBGUESTFS_BACKEND ./cloud/build.sh
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family || (inputs.target == 'rocky' && matrix.family == 'rocky') }}
        with:
          name: task-ai-desktop-cloud-${{ matrix.target }}
          path: cloud/output/*.qcow2
          if-no-files-found: error

  build-debian:
    name: Build ${{ matrix.target }} ISO
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_iso && (inputs.target == 'all' || inputs.target == 'debian' || inputs.target == 'ubuntu') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian
            suite: trixie
            mode: debian
            mirror: https://deb.debian.org/debian
            archive_areas: 'main contrib non-free non-free-firmware'
          - target: ubuntu
            suite: resolute
            mode: ubuntu
            mirror: https://archive.ubuntu.com/ubuntu
            archive_areas: 'main restricted universe multiverse'
    steps:
      - uses: actions/checkout@v4
      - name: Install Live ISO tools
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools rsync curl
      - name: Fetch target-compatible component packages
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          DEBIAN_DEB_URL: ${{ inputs.debian_deb_url }}
          UBUNTU_DEB_URL: ${{ inputs.ubuntu_deb_url }}
        run: |
          set -euo pipefail
          case "${TARGET}" in
            debian) AI_DESKTOP_DEB_URL="${DEBIAN_DEB_URL}" ;;
            ubuntu) AI_DESKTOP_DEB_URL="${UBUNTU_DEB_URL}" ;;
            *) echo "unsupported Debian-family target: ${TARGET}" >&2; exit 2 ;;
          esac
          test -n "${AI_DESKTOP_DEB_URL}" || {
            echo "workflow_dispatch requires the ${TARGET}_deb_url input when build_iso=true" >&2
            exit 2
          }
          mkdir -p "$RUNNER_TEMP/ai-desktop-debs"
          curl --fail --location --retry 3 "$AI_DESKTOP_DEB_URL" -o "$RUNNER_TEMP/ai-desktop-debs/packages.tar.gz"
          tar -xzf "$RUNNER_TEMP/ai-desktop-debs/packages.tar.gz" -C "$RUNNER_TEMP/ai-desktop-debs"
      - name: Build ISO
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target }}
        env:
          DISPLAY_MANAGER: ${{ inputs.display_manager }}
          DESKTOP_CORE: ${{ inputs.desktop_core }}
          AI_DESKTOP_DEB_DIR: ${{ runner.temp }}/ai-desktop-debs
          DEBIAN_SUITE: ${{ matrix.suite }}
          LB_MODE: ${{ matrix.mode }}
          DEBIAN_MIRROR: ${{ matrix.mirror }}
          DEBIAN_ARCHIVE_AREAS: ${{ matrix.archive_areas }}
        run: sudo --preserve-env=DISPLAY_MANAGER,DESKTOP_CORE,AI_DESKTOP_DEB_DIR,DEBIAN_SUITE,LB_MODE,DEBIAN_MIRROR,DEBIAN_ARCHIVE_AREAS ./debian-ai-desktop-iso/build.sh
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.target == 'all' || inputs.target == matrix.target }}
        with:
          name: task-ai-desktop-${{ matrix.target }}-iso
          path: debian-ai-desktop-iso/output/*.iso
          if-no-files-found: error

  build-rpm:
    name: Build ${{ matrix.target }} ISO
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_iso && (inputs.target == 'all' || inputs.target == 'fedora' || inputs.target == 'rocky') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fedora
            family: fedora
            image: fedora:43
            release: '43'
          - target: rocky
            family: rocky
            image: rockylinux:9
            release: '9'
          - target: rocky-10
            family: rocky
            image: rockylinux:10
            release: '10'
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM ISO in native distribution container
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family }}
        env:
          TARGET: ${{ matrix.family }}
          IMAGE: ${{ matrix.image }}
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          docker run --privileged --rm \
            -e OS_FAMILY="$TARGET" \
            -e OS_RELEASE="$RELEASE" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace "$IMAGE" bash -ceu '
              dnf -y install dnf-plugins-core
              if [ "$OS_FAMILY" = rocky ]; then
                dnf -y install epel-release || true
                dnf config-manager --set-enabled crb || true
              fi
              dnf -y install lorax createrepo_c xorriso syslinux
              ./rpm-custom-iso/build.sh
            '
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.target == 'all' || inputs.target == matrix.family }}
        with:
          name: task-ai-desktop-${{ matrix.target }}-iso
          path: rpm-custom-iso/output/*.iso
          if-no-files-found: error

  publish-object-storage:
    name: Publish build artifacts to object storage
    needs: [build-container, build-cloud, build-debian, build-rpm]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_object_storage && (inputs.build_container || inputs.build_cloud || inputs.build_iso) && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    env:
      OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION || 'us-east-1' }}
      OBJECT_STORAGE_PREFIX: ${{ inputs.object_storage_prefix }}
    steps:
      - name: Validate object storage configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OBJECT_STORAGE_BUCKET}" || {
            echo 'OBJECT_STORAGE_BUCKET secret is required when publish_object_storage=true' >&2
            exit 2
          }
          test -n "${OBJECT_STORAGE_PREFIX}" || {
            echo 'object_storage_prefix must not be empty' >&2
            exit 2
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.OBJECT_STORAGE_REGION }}
          role-to-assume: ${{ secrets.OBJECT_STORAGE_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: task-ai-desktop-*
          path: ${{ runner.temp }}/isobuilder-artifacts

      - name: Publish artifacts and checksums
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ env.OBJECT_STORAGE_ENDPOINT }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/isobuilder-artifacts"
          release="${OBJECT_STORAGE_PREFIX%/}/${GITHUB_REF_NAME}/${GITHUB_SHA}/${GITHUB_RUN_ID}"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS"
          aws_args=(--region "${OBJECT_STORAGE_REGION}")
          if [[ -n "${AWS_ENDPOINT_URL}" ]]; then
            aws_args+=(--endpoint-url "${AWS_ENDPOINT_URL}")
          fi
          aws s3 sync "$root" "s3://${OBJECT_STORAGE_BUCKET}/${release}" "${aws_args[@]}" --only-show-errors
          echo "Published to s3://${OBJECT_STORAGE_BUCKET}/${release}"
